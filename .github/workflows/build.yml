name: Build CC Size
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        scheme: [rootless, roothide]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
      - name: Install tools
        run: brew install make ldid dpkg
      - name: Install Theos and SDK
        run: |
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          cp -R "$RUNNER_TEMP/sdks/iPhoneOS16.5.sdk" "$HOME/theos/sdks/"
      - name: Build
        env:
          THEOS: /Users/runner/theos
        run: sh build.sh "${{ matrix.scheme }}"
      - uses: actions/upload-artifact@v4
        with:
          name: CCSize-${{ matrix.scheme }}
          path: packages/*.deb
